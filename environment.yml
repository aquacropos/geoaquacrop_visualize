name: geoaquacrop-visualizer

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
      # ── Core data ──────────────────────────────────────────────────────
      - pandas==2.3.3
      - numpy==2.2.6
      - xarray==2025.6.1
      - netCDF4==1.7.4
      - scipy==1.15.2

      # ── Geospatial ─────────────────────────────────────────────────────
      - rasterio==1.4.4

      # ── Visualisation ──────────────────────────────────────────────────
      - plotly==5.24.1
      - dash==3.0.4
      - dash-bootstrap-components==2.0.4

      # ── Testing ────────────────────────────────────────────────────────
      - pytest==9.1.1

      # ── Docs ───────────────────────────────────────────────────────────
      - Sphinx==8.1.3
      - sphinx-rtd-theme==3.1.0