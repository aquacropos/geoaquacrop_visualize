[pytest]
# ── Test discovery ─────────────────────────────────────────────────────────────
testpaths     = tests
python_files  = test_*.py
python_classes= Test*
python_functions = test_*

# ── Output ─────────────────────────────────────────────────────────────────────
addopts =
    -q
    --tb=short
    --strict-markers

# ── Custom markers ─────────────────────────────────────────────────────────────
markers =
    slow: marks tests that are slow to run (deselect with -m "not slow")
    integration: marks tests that require the full dataset
    unit: marks pure logic tests that need no data files

# ── Path ───────────────────────────────────────────────────────────────────────
# Needed so conftest.py can import _paths without an __init__.py in tests/.
pythonpath = tests
