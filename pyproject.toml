# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                        PACKAGING CONFIGURATION                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Dependencies are unversioned except where a floor is required, so pip resolves
# whatever is current. Pin an exact set with a lock file or `pip freeze` if a
# reproducible environment is needed.
#
# Install for development with `pip install -e .`, or as a user would with
# `pip install .`. Either works: data locations come from GEOAQUACROP_ROOT or
# from the arguments to geoaquacrop_visualize.run(), never from searching the
# filesystem, so the package behaves identically installed or editable.
#
# This project uses a src layout: the importable code lives in src/, the suite
# in tests/.

[build-system]
requires      = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaquacrop_visualize"
version = "0.1.0"
description = "Interactive Dash/Plotly visualisation toolkit for gridded AquaCrop simulations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]  
authors = [
    { name = "Josias Lang-Ritter" },
    { name = "Chris Bowden" },
    { name = "Seyed Hossein Hosseini" },
    { name = "Henrikki Tenkanen" },
    { name = "Tim Foster" },
    ]

maintainers = [
    { name = "Seyed Hossein Hosseini", email = "seyed.h.hosseini@aalto.fi" },
]

keywords = [
    "aquacrop",
    "agronomy",
    "crop-model",
    "hydrology",
    "geospatial",
    "dash",
    "plotly",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Dash",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Visualization",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
# Unversioned: pip resolves whatever is current. See the Plotly note below.
dependencies = [
    # Core data
    "pandas",
    "numpy",
    "xarray",
    "netCDF4",            # xarray engine for the .nc climate/SPAM/calendar grids
    "scipy",
    # Visualisation
    # Maps use the MapLibre trace API (go.Choroplethmap / go.Scattermap), which
    # needs Plotly 6 or newer -- the old *mapbox traces were removed in 6.0, so
    # an older Plotly resolved here will fail at import.
    "plotly>=6",
    "dash",
    "dash-bootstrap-components",
]

[project.optional-dependencies]
# GeoTIFF export is optional: export_data() degrades gracefully without rasterio.
geotiff = ["rasterio"]
test = ["pytest"]
docs = ["Sphinx", "sphinx-rtd-theme"]
dev = [
    "geoaquacrop_visualize[geotiff,test,docs]",
]

[project.urls]
Homepage = "https://github.com/aquacropos/geoaquacrop_visualize"
Repository = "https://github.com/aquacropos/geoaquacrop_visualize"

[project.scripts]
geoaquacrop_visualize = "geoaquacrop_visualize:main"

# ── Packaging (src layout) ────────────────────────────────────────────────────
[tool.setuptools]
# The application package under src/.
packages = ["geoaquacrop_visualize"]

[tool.setuptools.package-dir]
"" = "src"

# No package data: the region outline is read from GEOJSON_PATH in the
# geoaquacrop-preprocess tree and thinned in memory at startup by boundary.py, so
# no geometry ships inside the package.

# ── Test configuration ────────────────────────────────────────────────────────
# The modular suite lives in tests/, one module per application module. The
# original single-file tests.py is still runnable explicitly with
# `pytest tests.py`, but is not collected by a bare `pytest`.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# tests/_paths.py finds the package under src/, so the suite runs whether or not
# the project has been installed.
pythonpath = ["src"]
